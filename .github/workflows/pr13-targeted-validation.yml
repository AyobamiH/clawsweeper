name: PR 13 targeted validation

on:
  pull_request:
    paths:
      - ".github/workflows/sweep.yml"
      - "test/sweep-workflow.test.ts"
      - ".github/workflows/pr13-targeted-validation.yml"

permissions:
  contents: read

jobs:
  sweep-workflow:
    name: sweep workflow regression test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Build runtime
        run: pnpm run build:all
      - name: Run sweep workflow tests
        run: node --test test/sweep-workflow.test.ts
