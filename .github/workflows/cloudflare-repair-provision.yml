name: Provision and prove Cloudflare repair compute
"on":
  workflow_dispatch: {}
  push:
    branches:
      - ops/cloudflare-compute-inventory
    paths:
      - .github/workflows/cloudflare-repair-provision.yml
permissions:
  contents: read
concurrency:
  group: cloudflare-repair-compute
  cancel-in-progress: false
env:
  CLAWSWEEPER_APP_CLIENT_ID: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build:node
      - name: Build and deploy pinned Cloudflare runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          mkdir -p cloudflare-repair/runtime
          cp -R dist cloudflare-repair/runtime/dist
          printf '{"type":"module"}\n' > cloudflare-repair/runtime/package.json
          npm ci --prefix cloudflare-repair --no-audit --no-fund
          cd cloudflare-repair
          npx wrangler deploy
  provision:
    name: Provision ephemeral Cloudflare repair compute
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.runners.outputs.plan }}
      execute: ${{ steps.runners.outputs.execute }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Mint bounded GitHub App credential
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: clawsweeper
          permission-administration: write
      - uses: ./.github/actions/cloudflare-runners
        id: runners
        with:
          operation: start
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
    needs: deploy
  plan-proof:
    needs: provision
    runs-on: ${{ needs.provision.outputs.plan }}
    timeout-minutes: 8
    steps:
      - name: Run real Linux containment preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compute-proof"
          command -v gh rg bwrap
          node --version
          node /opt/clawsweeper/dist/repair/containment-preflight.js | tee "$RUNNER_TEMP/compute-proof/containment.log"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/compute-proof/source-head.txt"
          printf '%s\n' "$RUNNER_NAME" > "$RUNNER_TEMP/compute-proof/runner.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cloudflare-plan-proof
          path: ${{ runner.temp }}/compute-proof
          if-no-files-found: error
  execute-proof:
    needs: provision
    runs-on: ${{ needs.provision.outputs.execute }}
    timeout-minutes: 8
    steps:
      - name: Run real Linux containment preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compute-proof"
          command -v gh rg bwrap
          node --version
          node /opt/clawsweeper/dist/repair/containment-preflight.js | tee "$RUNNER_TEMP/compute-proof/containment.log"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/compute-proof/source-head.txt"
          printf '%s\n' "$RUNNER_NAME" > "$RUNNER_TEMP/compute-proof/runner.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cloudflare-execute-proof
          path: ${{ runner.temp }}/compute-proof
          if-no-files-found: error
  cleanup:
    name: Destroy ephemeral Cloudflare repair compute
    needs:
      - deploy
      - provision
      - plan-proof
      - execute-proof
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Mint bounded GitHub App credential
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: clawsweeper
          permission-administration: write
      - uses: ./.github/actions/cloudflare-runners
        id: runners
        with:
          operation: stop
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
