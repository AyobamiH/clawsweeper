name: Provision Cloudflare repair compute
on:
  push:
    branches: [ops/cloudflare-compute-inventory]
    paths: [.github/workflows/cloudflare-repair-provision.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: cloudflare-repair-provision
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      runner_label: ${{ steps.deploy.outputs.runner_label }}
    steps:
      - name: Cancel obsolete Blacksmith repair attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api repos/AyobamiH/clawsweeper/actions/runs/36317975019 --jq .status)"
          if [ "$state" != completed ]; then
            gh api --method POST repos/AyobamiH/clawsweeper/actions/runs/36317975019/cancel
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build:node
      - name: Prepare isolated container runtime
        run: |
          mkdir -p cloudflare-repair/runtime
          cp -R dist cloudflare-repair/runtime/dist
          printf '{"type":"module"}\n' > cloudflare-repair/runtime/package.json
          npm ci --prefix cloudflare-repair --no-audit --no-fund
      - name: Create scoped runner registration token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: clawsweeper
          permission-administration: write
      - name: Deploy dedicated compute and prove containment
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          cd cloudflare-repair
          npx wrangler deploy
          probe_token="$(openssl rand -hex 32)"
          echo "::add-mask::$probe_token"
          printf '%s' "$probe_token" | npx wrangler secret put PROBE_TOKEN
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 10 --max-time 180 \
            --request POST --header "Authorization: Bearer $probe_token" \
            https://ayobamih-clawsweeper-compute.woeinvests.workers.dev/probe \
            --output "$RUNNER_TEMP/cloudflare-containment-proof.json"
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify(r)); if(r.exitCode!==0) process.exit(1)' "$RUNNER_TEMP/cloudflare-containment-proof.json"
          runner_name="csw-$(openssl rand -hex 8)-plan"
          echo "runner_label=$runner_name" >> "$GITHUB_OUTPUT"
          registration="$(gh api --method POST repos/AyobamiH/clawsweeper/actions/runners/generate-jitconfig -f name="$runner_name" -F runner_group_id=1 -f 'labels[]=self-hosted' -f 'labels[]=Linux' -f 'labels[]=X64' -f "labels[]=$runner_name" --jq .encoded_jit_config)"
          echo "::add-mask::$registration"
          payload="$RUNNER_TEMP/runner-start.json"
          jq -n --arg name "$runner_name" --arg jit "$registration" '{name:$name,jit:$jit}' > "$payload"
          curl --fail --silent --show-error --max-time 180 --request POST --header "Authorization: Bearer $probe_token" --header 'Content-Type: application/json' --data-binary @"$payload" https://ayobamih-clawsweeper-compute.woeinvests.workers.dev/runner
          for attempt in $(seq 1 12); do
            runner_status="$(gh api repos/AyobamiH/clawsweeper/actions/runners --jq ".runners[] | select(.name == \"$runner_name\") | .status")"
            if [ "$runner_status" = online ]; then break; fi
            sleep 5
          done
          if [ "$runner_status" != online ]; then
            jq -n --arg name "$runner_name" '{name:$name}' > "$payload"
            curl --fail --silent --show-error --max-time 90 --request POST --header "Authorization: Bearer $probe_token" --header 'Content-Type: application/json' --data-binary @"$payload" https://ayobamih-clawsweeper-compute.woeinvests.workers.dev/runner-status
            exit 1
          fi
          rm -f "$payload"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cloudflare-containment-proof
          path: ${{ runner.temp }}/cloudflare-containment-proof.json
          if-no-files-found: warn

  runner-proof:
    needs: provision
    runs-on: ${{ needs.provision.outputs.runner_label }}
    timeout-minutes: 5
    steps:
      - name: Prove Cloudflare runner execution and containment
        run: |
          command -v gh rg bwrap
          test -f /sandbox
          node /opt/clawsweeper/dist/repair/containment-preflight.js
          echo 'Cloudflare ephemeral GitHub runner executed the real containment preflight.'
