name: Provision Cloudflare repair compute
on:
  push:
    branches: [ops/cloudflare-compute-inventory]
    paths: [cloudflare-repair/**, .github/workflows/cloudflare-repair-provision.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: cloudflare-repair-provision
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Cancel obsolete Blacksmith repair attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api repos/AyobamiH/clawsweeper/actions/runs/36317975019 --jq .status)"
          if [ "$state" != completed ]; then
            gh api --method POST repos/AyobamiH/clawsweeper/actions/runs/36317975019/cancel
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build:node
      - name: Prepare isolated container runtime
        run: |
          mkdir -p cloudflare-repair/runtime
          cp -R dist cloudflare-repair/runtime/dist
          printf '{"type":"module"}\n' > cloudflare-repair/runtime/package.json
          npm ci --prefix cloudflare-repair --no-audit --no-fund
      - name: Deploy dedicated compute and prove containment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          cd cloudflare-repair
          npx wrangler deploy
          probe_token="$(openssl rand -hex 32)"
          echo "::add-mask::$probe_token"
          printf '%s' "$probe_token" | npx wrangler secret put PROBE_TOKEN
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 10 --max-time 180 \
            --request POST --header "Authorization: Bearer $probe_token" \
            https://ayobamih-clawsweeper-compute.woeinvests.workers.dev/probe \
            --output "$RUNNER_TEMP/cloudflare-containment-proof.json"
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify(r)); if(r.exitCode!==0) process.exit(1)' "$RUNNER_TEMP/cloudflare-containment-proof.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cloudflare-containment-proof
          path: ${{ runner.temp }}/cloudflare-containment-proof.json
          if-no-files-found: warn
