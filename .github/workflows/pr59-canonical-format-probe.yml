name: PR59 canonical format probe
on:
  push:
    branches: [fix/openclaw-nonzero-final-result-20260930]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Format OpenClaw process and print diff
        run: |
          pnpm exec oxfmt src/openclaw-process.ts
          echo '===DIFF==='
          git diff -- src/openclaw-process.ts
