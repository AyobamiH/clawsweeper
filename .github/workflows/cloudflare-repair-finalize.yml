name: Retain Cloudflare repair evidence and clean up compute
on:
  push:
    branches: [ops/cloudflare-compute-inventory]
    paths: [.github/workflows/cloudflare-repair-finalize.yml]
permissions:
  contents: read
  actions: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create scoped publication token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: clawsweeper
          permission-actions: write
          permission-administration: write
      - name: Cancel obsolete publisher and retain controlled runtime receipts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          state="$(gh api repos/AyobamiH/clawsweeper/actions/runs/36325859959 --jq .status)"
          if [ "$state" != completed ]; then gh api --method POST repos/AyobamiH/clawsweeper/actions/runs/36325859959/cancel; fi
          cd cloudflare-repair
          npm ci --no-audit --no-fund
          npx wrangler deploy --containers-rollout=none
          probe_token="$(openssl rand -hex 32)"
          echo "::add-mask::$probe_token"
          printf '%s' "$probe_token" | npx wrangler secret put PROBE_TOKEN
          mkdir -p "$RUNNER_TEMP/repair-proof"
          printf '{"name":"csw-72b73dc32d9b59b2-execute"}' > "$RUNNER_TEMP/request.json"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 10 --retry-max-time 180 --max-time 60 --request POST --header "Authorization: Bearer $probe_token" --header 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/request.json" --output "$RUNNER_TEMP/repair-proof/controlled-runtime-receipts.json" https://ayobamih-clawsweeper-compute.woeinvests.workers.dev/repair-proof
          node -e 'const r=require(process.argv[1]); if(!r.bindings.some(b=>b.head==="c50244478afcc394732376f7e28448368ef02bad") || !Object.keys(r.files).some(p=>p.includes("pr10-review-06a630b/instagram.json"))) process.exit(1); console.log("Current-head binding and controlled runtime receipts retained")' "$RUNNER_TEMP/repair-proof/controlled-runtime-receipts.json"
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/repair-proof/subscription-quota.json" https://ayobamih-clawsweeper-status.woeinvests.workers.dev/api/subscription-quota
          for lane in plan execute; do
            jq -n --arg name "csw-72b73dc32d9b59b2-$lane" '{name:$name}' > "$RUNNER_TEMP/request.json"
            curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 5 --max-time 60 --request DELETE --header "Authorization: Bearer $probe_token" --header 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/request.json" --output "$RUNNER_TEMP/cleanup.json" https://ayobamih-clawsweeper-compute.woeinvests.workers.dev/runner
          done
          gh workflow run repair-publish-results.yml --repo AyobamiH/clawsweeper --ref ops/cloudflare-compute-inventory -f run_id=36323734781
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: operator-10-controlled-runtime-proof
          path: ${{ runner.temp }}/repair-proof
          if-no-files-found: error
