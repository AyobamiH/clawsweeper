name: repair containment smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-pnpm/**"
      - ".github/workflows/repair-cluster-worker.yml"
      - ".github/workflows/repair-containment-smoke.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "src/command.ts"
      - "src/repair/command-runner.ts"
      - "src/repair/contained-command-sandbox.ts"
      - "src/repair/contained-command-worker.ts"
      - "src/repair/containment-preflight.ts"
      - "src/repair/process-tree-containment.ts"
      - "test/repair/command-runner.test.ts"
      - "test/repair/containment-preflight.test.ts"
      - "test/repair/process-tree-containment.test.ts"
      - "test/repair/repair-cluster-worker-containment.test.ts"
      - "test/repair/repair-containment-smoke-workflow.test.ts"
      - "test/repair/target-validation.test.ts"
      - "tsconfig.repair.json"
  pull_request:
    paths:
      - ".github/actions/setup-pnpm/**"
      - ".github/workflows/repair-cluster-worker.yml"
      - ".github/workflows/repair-containment-smoke.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "src/command.ts"
      - "src/repair/command-runner.ts"
      - "src/repair/contained-command-sandbox.ts"
      - "src/repair/contained-command-worker.ts"
      - "src/repair/containment-preflight.ts"
      - "src/repair/process-tree-containment.ts"
      - "test/repair/command-runner.test.ts"
      - "test/repair/containment-preflight.test.ts"
      - "test/repair/process-tree-containment.test.ts"
      - "test/repair/repair-cluster-worker-containment.test.ts"
      - "test/repair/repair-containment-smoke-workflow.test.ts"
      - "test/repair/target-validation.test.ts"
      - "tsconfig.repair.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-repair-compute
  queue: max
  cancel-in-progress: false

env:
  CLAWSWEEPER_APP_CLIENT_ID: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}

jobs:
  provision:
    name: Provision containment smoke compute
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.runners.outputs.plan }}
      execute: ${{ steps.runners.outputs.execute }}
      attempt: ${{ steps.runners.outputs.attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Mint bounded GitHub App credential
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: clawsweeper
          permission-administration: write
      - uses: ./.github/actions/cloudflare-runners
        id: runners
        with:
          operation: start
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

  containment-smoke:
    name: containment smoke (sample ${{ matrix.sample }})
    needs: provision
    runs-on: ${{ needs.provision.outputs.attempt == format('{0}', github.run_attempt) && needs.provision.outputs[matrix.lane] || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - sample: 1
            lane: plan
          - sample: 2
            lane: execute
    steps:
      - name: Require fresh compute provisioning for this attempt
        if: ${{ needs.provision.outputs.attempt != format('{0}', github.run_attempt) }}
        run: |
          echo "Rerun all jobs so containment smoke receives fresh Cloudflare compute." >&2
          exit 1
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build:repair

      - name: Run compiled containment preflight
        run: pnpm run repair:containment-smoke

  cleanup:
    name: Destroy containment smoke compute
    needs: [provision, containment-smoke]
    if: ${{ always() && needs.provision.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Mint bounded GitHub App credential
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: clawsweeper
          permission-administration: write
      - uses: ./.github/actions/cloudflare-runners
        with:
          operation: stop
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
