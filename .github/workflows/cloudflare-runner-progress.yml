name: Read bounded Cloudflare repair progress
on:
  push:
    branches: [ops/cloudflare-compute-inventory]
    paths: [.github/workflows/cloudflare-runner-progress.yml]
permissions:
  contents: read
jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read progress metadata without restarting compute
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          cd cloudflare-repair
          npm ci --no-audit --no-fund
          npx wrangler deploy --containers-rollout=none
          probe_token="$(openssl rand -hex 32)"
          echo "::add-mask::$probe_token"
          printf '%s' "$probe_token" | npx wrangler secret put PROBE_TOKEN
          printf '{"name":"csw-72b73dc32d9b59b2-execute"}' > "$RUNNER_TEMP/progress.json"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 10 --retry-max-time 120 --max-time 30 --request POST --header "Authorization: Bearer $probe_token" --header 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/progress.json" https://ayobamih-clawsweeper-compute.woeinvests.workers.dev/runner-progress
