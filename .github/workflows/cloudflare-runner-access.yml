name: Verify Cloudflare runner registration access
on:
  push:
    branches: [ops/cloudflare-compute-inventory]
    paths: [.github/workflows/cloudflare-runner-access.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request existing runner administration permission
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: clawsweeper
          permission-administration: write
      - name: Verify runner registry is accessible
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api repos/AyobamiH/clawsweeper/actions/runners --jq '{total_count, runners:[.runners[] | {name,status,busy}]}'
