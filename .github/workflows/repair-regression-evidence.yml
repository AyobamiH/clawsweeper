name: repair regression evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/repair-regression-evidence.yml

permissions:
  contents: write

jobs:
  evidence:
    if: github.event.pull_request.number == 79 && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'AyobamiH' && github.event.pull_request.head.ref == 'fix/repair-command-execution-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Apply the digest-pinned locally tested candidate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "af51ae580d8e223c9adfb94e943cd999a7b5ccb9"
          test "$(git rev-parse HEAD^^)" = "6729edf3c9a42a447e7e02aeac4556a38dffefb8"
          test "$(git diff --name-only HEAD^^ HEAD)" = ".github/workflows/repair-regression-evidence.yml"
          mkdir -p .artifacts/repair-candidate
          python3 - <<'PY'
          import base64, gzip, hashlib, re, subprocess
          from pathlib import Path
          transport = subprocess.check_output(['git', 'show', 'HEAD^:.github/workflows/repair-regression-evidence.yml'], text=True)
          encoded = re.search("encoded = '''(.*?)'''", transport, re.S).group(1)
          corrections = {
              'UvWP4iA3wTaTT': 'UvWP4iA3TaTT',
              'AW1xJMxmIY59r0Ys': 'AW1xJMxmI59r0Ys',
              'EcN6Tbvf6c4c1970e819qyvc': 'EcN6Tbvf6qyvc',
              'YDghI39S5I5nL8wiSZE': 'YDghI39S5I+nL8wiSZE',
              'WHMOgrTncYE': 'WHMOgrqncYE',
          }
          for before, after in corrections.items():
              assert encoded.count(before) == 1, before
              encoded = encoded.replace(before, after)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == 'bc9164b27449e82943ced0d9d2363f9302a46cd0629a8efa63f8ebf13f5ad508', digest
          Path('.artifacts/repair-candidate/candidate.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '.artifacts/repair-candidate/candidate.patch'], check=True)
          PY
          git rm .github/workflows/repair-regression-evidence.yml
          git diff --cached --check
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: "24"
          build-script: build:all
      - name: Recheck candidate behaviour and contracts
        run: |
          set -euo pipefail
          pnpm run check:static
          pnpm run lint
          node --test test/openclaw-process.test.ts test/repair/repair-dispatch-authorization.test.ts test/repair/cluster-workflow-security.test.ts | tee .artifacts/repair-candidate/focused.log
          node --test --test-name-pattern 'agent workflows install pinned CLI releases' test/clawsweeper.test.ts | tee .artifacts/repair-candidate/pin.log
      - name: Store immutable candidate objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          approved = {
              '.github/workflows/repair-regression-evidence.yml',
              'src/openclaw-process.ts', 'src/repair/comment-router.ts',
              'src/repair/repair-dispatch-authorization.ts', 'test/clawsweeper.test.ts',
              'test/openclaw-process.test.ts', 'test/repair/cluster-workflow-security.test.ts',
              'test/repair/repair-dispatch-authorization.test.ts', 'docs/repair/operations.md',
              'docs/proof/repair-command-execution/README.md',
              'docs/proof/repair-command-execution/results.json',
              'docs/proof/repair-command-execution/focused-green.log',
              'docs/proof/repair-command-execution/pin-regression-green.log',
              'docs/proof/repair-command-execution/replay-regression-red.log',
          }
          changed = git('diff', '--cached', '--name-only').splitlines()
          assert set(changed) == approved, changed
          assert git('diff', '--name-only') == '', 'Unstaged tracked modifications'
          def post(endpoint, payload):
              assert endpoint in ('git/blobs', 'git/trees')
              request = urllib.request.Request(
                  'https://api.github.com/repos/AyobamiH/clawsweeper/' + endpoint,
                  data=json.dumps(payload).encode(), method='POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = []
          for name in changed:
              if name == '.github/workflows/repair-regression-evidence.yml':
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, expected, index = git('ls-files', '--stage', '--', name).split('\t', 1)[0].split()
              assert index == '0' and mode in ('100644', '100755')
              payload = base64.b64encode(Path(name).read_bytes()).decode()
              blob = post('git/blobs', {'content': payload, 'encoding': 'base64'})
              assert blob['sha'] == expected, name
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': expected})
          tree = post('git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})
          assert tree['sha'] == git('write-tree'), 'Remote candidate tree mismatch'
          receipt = {'parent': git('rev-parse', 'HEAD'), 'tree': tree['sha'],
                     'candidatePatchSha256': 'bc9164b27449e82943ced0d9d2363f9302a46cd0629a8efa63f8ebf13f5ad508',
                     'entries': entries, 'branchWrites': 0, 'modelCalls': 0}
          Path('.artifacts/repair-candidate/tree-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validated-repair-candidate
          path: .artifacts/repair-candidate/
          retention-days: 3
          if-no-files-found: error
