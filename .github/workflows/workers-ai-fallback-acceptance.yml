name: Workers AI fallback acceptance

on:
  push:
    branches:
      - feat/inference-auto-routing-20260928
  workflow_dispatch:
    inputs:
      release_review:
        description: Review the pinned source revision using the existing inference router
        type: boolean
        default: false
      release_base:
        description: Exact 40-character base commit
        type: string
      release_head:
        description: Exact 40-character head commit
        type: string
      release_ai_max_calls:
        description: "Explicit per-run Workers AI call budget (0 disables inference; maximum 8)"
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: workers-ai-fallback-acceptance
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_review != true }}
    runs-on: [self-hosted, Linux, X64, "clawsweeper-ci-privileged-${{ github.run_id }}-smoke"]
    timeout-minutes: 12
    env:
      CLAWSWEEPER_INFERENCE_POLICY: workers-ai
      CLAWSWEEPER_WORKERS_AI_MODEL: ${{ vars.CLAWSWEEPER_WORKERS_AI_MODEL || '@cf/zai-org/glm-5.3' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build:node

      - name: Resolve forced Workers AI route
        id: route
        run: |
          set -euo pipefail
          route="$(node dist/inference-router.js)"
          jq -e '.available == true and .runner == "openclaw" and .reason == "forced_workers_ai"' <<<"$route" >/dev/null
          model="$(jq -r '.model' <<<"$route")"
          providers_json="$(jq -c '.providersJson | fromjson' <<<"$route")"
          echo "CLAWSWEEPER_RUNNER=openclaw" >> "$GITHUB_ENV"
          echo "CLAWSWEEPER_OPENCLAW_MODEL=$model" >> "$GITHUB_ENV"
          echo "CLAWSWEEPER_OPENCLAW_PROVIDERS_JSON=$providers_json" >> "$GITHUB_ENV"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "Selected Workers AI route: $model"

      - uses: ./.github/actions/setup-openclaw

      - name: Prove live Workers AI inference through ClawSweeper adapter
        env:
          EXPECTED: CLAWSWEEPER_WORKERS_AI_OK
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { runAgentProcess } from "./dist/agent-runner.js";

          const expected = process.env.EXPECTED;
          const result = runAgentProcess({
            label: "workers-ai-fallback-acceptance",
            scanSource: { kind: "prompt" },
            prompt: [
              "This is a bounded ClawSweeper inference acceptance check.",
              `Return exactly this token and nothing else: ${expected}`,
              "Do not inspect files or execute commands.",
            ].join("\n"),
            model: "internal",
            reasoningEffort: "low",
            cwd: process.cwd(),
            env: process.env,
            timeoutMs: 120000,
            tailBytes: 8192,
            outputFileBytes: 8192,
          });
          if (result.error || result.status !== 0) {
            console.error(result.error?.message || result.stderr || "Workers AI inference failed");
            process.exit(1);
          }
          if (result.stdout.trim() !== expected) {
            console.error(`Unexpected model response: ${JSON.stringify(result.stdout.trim())}`);
            process.exit(1);
          }
          console.log("Workers AI fallback inference accepted.");
          NODE

  release-source-review:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_review == true && github.repository == 'AyobamiH/clawsweeper' }}
    runs-on: [self-hosted, Linux, X64, "clawsweeper-ci-ops-${{ github.run_id }}-release-review"]
    # Checkout and pinned tool bootstrap consume several minutes on the isolated
    # runner. Keep a finite job budget while allowing the bounded per-chunk review.
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CLAWSWEEPER_INFERENCE_POLICY: auto
      CLAWSWEEPER_RELEASE_AI_MAX_CALLS: ${{ inputs.release_ai_max_calls || 0 }}
      CLAWSWEEPER_WORKERS_AI_MODEL: ${{ vars.CLAWSWEEPER_WORKERS_AI_MODEL || '@cf/zai-org/glm-5.3' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLAWSWEEPER_QUOTA_URL: ${{ vars.CLAWSWEEPER_QUOTA_URL }}
    steps:
      - name: Validate pinned release inputs before checkout
        env:
          REVIEW_BASE: ${{ inputs.release_base }}
          REVIEW_HEAD: ${{ inputs.release_head }}
        run: |
          set -euo pipefail
          [[ "$REVIEW_BASE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REVIEW_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$REVIEW_BASE" != "$REVIEW_HEAD"
      - name: Require owner-approved immutable workflow source before checkout
        env:
          APPROVED_SHA: ${{ vars.CLAWSWEEPER_TRUSTED_MAIN_SHA }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REPOSITORY" = "AyobamiH/clawsweeper"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$APPROVED_SHA"
      - name: Checkout trusted review tooling at workflow revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ vars.CLAWSWEEPER_TRUSTED_MAIN_SHA }}
      - name: Verify checked-out approved tooling before local actions
        env:
          APPROVED_SHA: ${{ vars.CLAWSWEEPER_TRUSTED_MAIN_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
      - name: Checkout pinned target source as review-only data
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_head }}
          path: target
      - name: Install pinned dependencies without privileged Corepack symlinks
        run: |
          set -euo pipefail
          # Keep the package manager cache within this isolated job. Never
          # install a floating version or write to privileged runner paths.
          export COREPACK_HOME="$RUNNER_TEMP/corepack-cache"
          mkdir -p "$COREPACK_HOME" "$RUNNER_TEMP/pnpm-bin"
          corepack enable --install-directory "$RUNNER_TEMP/pnpm-bin"
          echo "$RUNNER_TEMP/pnpm-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/pnpm-bin:$PATH"
          # A transient registry TLS reset must not require a new workflow.
          # Every attempt still resolves the repository's exact pinned version.
          for attempt in 1 2 3; do
            if corepack pnpm --version; then break; fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Pinned package manager unavailable after bounded retries' >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          test "$(pnpm --version)" = "11.10.0"
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then break; fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Frozen dependency installation failed after bounded retries' >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          pnpm run build:node
      - name: Install existing trusted input scanner
        run: bash .github/actions/setup-review-tools/install.sh
      - name: Read-only exact-head preflight
        env:
          REVIEW_BASE: ${{ inputs.release_base }}
          REVIEW_HEAD: ${{ inputs.release_head }}
        run: node scripts/review-release.mjs --preflight target "$REVIEW_BASE" "$REVIEW_HEAD"
      - name: Review exact source without mutation
        env:
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
          CLAWSWEEPER_QUOTA_SECRET: ${{ secrets.CLAWSWEEPER_QUOTA_SECRET }}
          REVIEW_BASE: ${{ inputs.release_base }}
          REVIEW_HEAD: ${{ inputs.release_head }}
        run: |
          set -euo pipefail
          node scripts/review-release.mjs target "$REVIEW_BASE" "$REVIEW_HEAD" "$RUNNER_TEMP/clawsweeper-release-review.json"
          node -e 'const r=require(process.argv[1]); if(!r.passed || r.head!==process.env.REVIEW_HEAD || r.base!==process.env.REVIEW_BASE) process.exit(1)' "$RUNNER_TEMP/clawsweeper-release-review.json"
      # The existing local owner-operated runner retains its output. No artifact
      # upload, PR merge, branch push or GitHub status fabrication is performed.
