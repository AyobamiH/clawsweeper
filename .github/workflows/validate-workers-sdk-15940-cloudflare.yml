name: Validate Workers SDK 15940 on Cloudflare

on:
  push:
    branches:
      - validation/workers-sdk-15940-cloudflare
    paths:
      - .github/workflows/validate-workers-sdk-15940-cloudflare.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-repair-compute
  queue: max
  cancel-in-progress: false

env:
  CLAWSWEEPER_APP_CLIENT_ID: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}
  RED_SHA: 5b1194f9d8fc4f8a39a6e153bf35382f0f3e6577
  GREEN_SHA: 775014677514aa35aaacdb0c9448174a33dbfe71

jobs:
  provision:
    name: Provision Cloudflare validation runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      runner: ${{ steps.runners.outputs.execute }}
      attempt: ${{ steps.runners.outputs.attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Mint bounded runner credential
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: clawsweeper
          permission-administration: write
      - uses: ./.github/actions/cloudflare-runners
        id: runners
        with:
          operation: start
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

  validate:
    name: RED/GREEN declaration-boundary proof on Cloudflare
    needs: provision
    runs-on: ${{ needs.provision.outputs.attempt == format('{0}', github.run_attempt) && needs.provision.outputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Require fresh Cloudflare compute
        if: ${{ needs.provision.outputs.attempt != format('{0}', github.run_attempt) }}
        run: |
          echo "Rerun all jobs so validation receives fresh Cloudflare compute." >&2
          exit 1

      - name: Prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@10.33.0
          node --version
          pnpm --version
          git --version

      - name: Fetch exact revisions and install once
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/workers-sdk-15940"
          mkdir -p "$root/source" "$root/evidence"
          git -C "$root/source" init
          git -C "$root/source" remote add origin https://github.com/AyobamiH/workers-sdk.git
          git -C "$root/source" fetch --depth=1 origin "$RED_SHA"
          git -C "$root/source" branch red FETCH_HEAD
          git -C "$root/source" fetch --depth=1 origin "$GREEN_SHA"
          git -C "$root/source" branch green FETCH_HEAD
          git -C "$root/source" checkout --detach red
          cd "$root/source"
          pnpm install --frozen-lockfile 2>&1 | tee "$root/evidence/install.log"
          printf '%s\n' "$RED_SHA" > "$root/evidence/red-sha.txt"
          printf '%s\n' "$GREEN_SHA" > "$root/evidence/green-sha.txt"
          printf '%s\n' "$RUNNER_NAME" > "$root/evidence/runner.txt"

      - name: Prove RED fails at the published declaration boundary
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/workers-sdk-15940"
          cd "$root/source"
          set +e
          pnpm exec turbo type:tests --filter=wrangler --force 2>&1 | tee "$root/evidence/red.log"
          red_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$red_exit" > "$root/evidence/red-exit.txt"
          test -s packages/wrangler/wrangler-dist/cli.d.ts
          wc -c < packages/wrangler/wrangler-dist/cli.d.ts | tr -d ' ' > "$root/evidence/red-cli-dts-bytes.txt"
          if [ "$red_exit" -eq 0 ]; then
            echo "RED unexpectedly passed; the regression does not prove the issue." >&2
            exit 1
          fi
          if ! grep -q "published declarations have unresolved package boundaries" "$root/evidence/red.log"; then
            echo "RED failed for an unexpected reason." >&2
            exit 1
          fi
          grep -E '@cloudflare/(workers-utils|containers-shared|workers-shared|remote-bindings)|devtools-protocol|yargs|cloudflare' "$root/evidence/red.log" > "$root/evidence/red-leaks.txt" || true
          test -s "$root/evidence/red-leaks.txt"

      - name: Prove GREEN passes and record declaration size
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/workers-sdk-15940"
          cd "$root/source"
          git reset --hard
          git clean -ffd -e node_modules
          git checkout --detach green
          set +e
          pnpm exec turbo check:lint check:type check:format type:tests --filter=wrangler --force 2>&1 | tee "$root/evidence/green.log"
          green_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$green_exit" > "$root/evidence/green-exit.txt"
          test -s packages/wrangler/wrangler-dist/cli.d.ts
          wc -c < packages/wrangler/wrangler-dist/cli.d.ts | tr -d ' ' > "$root/evidence/green-cli-dts-bytes.txt"
          if [ "$green_exit" -ne 0 ]; then
            exit "$green_exit"
          fi

      - name: Summarise evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/workers-sdk-15940"
          red_bytes="$(cat "$root/evidence/red-cli-dts-bytes.txt" 2>/dev/null || echo missing)"
          green_bytes="$(cat "$root/evidence/green-cli-dts-bytes.txt" 2>/dev/null || echo missing)"
          {
            echo "red_sha=$RED_SHA"
            echo "green_sha=$GREEN_SHA"
            echo "runner=$RUNNER_NAME"
            echo "red_exit=$(cat "$root/evidence/red-exit.txt" 2>/dev/null || echo missing)"
            echo "green_exit=$(cat "$root/evidence/green-exit.txt" 2>/dev/null || echo missing)"
            echo "red_cli_dts_bytes=$red_bytes"
            echo "green_cli_dts_bytes=$green_bytes"
            if [[ "$red_bytes" =~ ^[0-9]+$ && "$green_bytes" =~ ^[0-9]+$ && "$red_bytes" -gt 0 ]]; then
              awk -v red="$red_bytes" -v green="$green_bytes" 'BEGIN { printf "size_ratio=%.3f\n", green/red }'
            fi
          } | tee "$root/evidence/summary.txt"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workers-sdk-15940-cloudflare-maintainer-proof
          path: ${{ runner.temp }}/workers-sdk-15940/evidence
          if-no-files-found: error

  cleanup:
    name: Destroy Cloudflare validation runner
    needs:
      - provision
      - validate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Mint bounded cleanup credential
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: clawsweeper
          permission-administration: write
      - uses: ./.github/actions/cloudflare-runners
        with:
          operation: stop
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
