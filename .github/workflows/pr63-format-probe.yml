name: PR63 format probe
on:
  push:
    branches: [fix/openclaw-top-level-structured-output-20260930]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Format changed files and print diff
        run: |
          pnpm exec oxfmt src/agent-runner.ts test/agent-runner.test.ts
          echo '===DIFF==='
          git diff -- src/agent-runner.ts test/agent-runner.test.ts
