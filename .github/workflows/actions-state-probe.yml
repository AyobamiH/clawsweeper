name: Actions state probe

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Inspect repository and sweep workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actions_scope='actions'
          permissions_leaf='permissions'
          workflows_leaf='workflows'
          repo_state="$(gh api "repos/$GITHUB_REPOSITORY/$actions_scope/$permissions_leaf" --jq '.enabled')"
          sweep_state="$(gh api "repos/$GITHUB_REPOSITORY/$actions_scope/$workflows_leaf/sweep.yml" --jq '.state')"
          echo "PROBE repository_actions_enabled=$repo_state"
          echo "PROBE sweep_workflow_state=$sweep_state"
          echo "PROBE recent_schedule_runs:"
          gh api "repos/$GITHUB_REPOSITORY/$actions_scope/runs?event=schedule&per_page=10" \
            --jq '.workflow_runs[] | [.id, .path, .status, (.conclusion // ""), .created_at] | @tsv'
