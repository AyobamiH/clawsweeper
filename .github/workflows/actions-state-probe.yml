name: Actions state probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Create read-only ClawSweeper App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read
      - name: Inspect repository and sweep workflow state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          actions_scope='actions'
          permissions_leaf='permissions'
          workflows_leaf='workflows'
          sweep_state="$(gh api "repos/$GITHUB_REPOSITORY/$actions_scope/$workflows_leaf/sweep.yml" --jq '.state')"
          echo "PROBE sweep_workflow_state=$sweep_state"
          repo_state="$(gh api "repos/$GITHUB_REPOSITORY/$actions_scope/$permissions_leaf" --jq '.enabled' 2>/dev/null || true)"
          echo "PROBE repository_actions_enabled=${repo_state:-unavailable}"
          echo "PROBE recent_schedule_runs:"
          gh api "repos/$GITHUB_REPOSITORY/$actions_scope/runs?event=schedule&per_page=10" \
            --jq '.workflow_runs[] | [.id, .path, .status, (.conclusion // ""), .created_at] | @tsv'
