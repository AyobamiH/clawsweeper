name: Actions state probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Create scoped ClawSweeper App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-contents: read
      - name: Refresh sweep scheduler registration
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          actions_scope='actions'
          workflows_leaf='workflows'
          workflow='sweep.yml'
          endpoint="repos/$GITHUB_REPOSITORY/$actions_scope/$workflows_leaf/$workflow"

          before="$(gh api "$endpoint" --jq '.state')"
          echo "REFRESH before=$before"
          if [ "$before" != 'active' ]; then
            echo "REFUSE: sweep.yml must start active; observed $before" >&2
            exit 1
          fi

          gh api --method PUT "$endpoint/disable" >/dev/null
          disabled="$(gh api "$endpoint" --jq '.state')"
          echo "REFRESH disabled=$disabled"
          if [ "$disabled" = 'active' ]; then
            echo 'FAIL: sweep.yml did not enter a disabled state.' >&2
            exit 1
          fi

          gh api --method PUT "$endpoint/enable" >/dev/null
          after="$(gh api "$endpoint" --jq '.state')"
          echo "REFRESH after=$after"
          if [ "$after" != 'active' ]; then
            echo "FAIL: sweep.yml was not restored to active." >&2
            exit 1
          fi

          echo 'PASS: sweep.yml scheduler registration refreshed; final state active.'
