name: Clear orphaned private review lease

on:
  push:
    branches:
      - ops/clear-private-review-lease-84-20260925

permissions:
  contents: read

env:
  CLAWSWEEPER_APP_CLIENT_ID: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Create target write token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: wagging-web-wins
          permission-issues: write
          permission-pull-requests: write
      - name: Delete orphaned failed-run lease comment
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          gh api repos/AyobamiH/wagging-web-wins/issues/comments/5832970912 --method DELETE
