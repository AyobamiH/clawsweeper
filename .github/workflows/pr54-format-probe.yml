name: PR54 format probe
on:
  push:
    branches: [fix/openclaw-attestation-latency-budget-20260928]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Format agent runner and print diff
        run: |
          pnpm exec oxfmt src/agent-runner.ts
          echo '===DIFF==='
          git diff -- src/agent-runner.ts
