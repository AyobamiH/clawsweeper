name: Clean up completed Cloudflare proof runners
on:
  push:
    branches: [ops/cloudflare-compute-inventory]
    paths: [.github/workflows/cloudflare-runner-cleanup.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create scoped runner cleanup token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: clawsweeper
          permission-administration: write
      - name: Destroy completed proof container and remove stale proof registrations
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          cd cloudflare-repair
          npm ci --no-audit --no-fund
          probe_token="$(openssl rand -hex 32)"
          echo "::add-mask::$probe_token"
          printf '%s' "$probe_token" | npx wrangler secret put PROBE_TOKEN
          printf '{"name":"csw-b8cea8c7b8298363-plan"}' > "$RUNNER_TEMP/cleanup.json"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 10 --retry-max-time 180 --max-time 90 --request DELETE --header "Authorization: Bearer $probe_token" --header 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/cleanup.json" https://ayobamih-clawsweeper-compute.woeinvests.workers.dev/runner
          for name in csw-2f9f3a6753e28d3d-plan csw-58aff21dcf85b241-plan csw-ac4fe93ac24d99b8-plan csw-b8cea8c7b8298363-plan; do
            runner_id="$(gh api repos/AyobamiH/clawsweeper/actions/runners --jq ".runners[] | select(.name == \"$name\" and .busy == false) | .id")"
            if [ -n "$runner_id" ]; then gh api --method DELETE "repos/AyobamiH/clawsweeper/actions/runners/$runner_id"; fi
          done
          echo 'Completed proof containers and stale registrations cleaned up.'
