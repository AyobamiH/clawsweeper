name: PR58 format probe
on:
  push:
    branches: [fix/openclaw-exec-checkout-attestation-20260930]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Format touched files and print canonical diffs
        run: |
          pnpm exec oxfmt src/openclaw-process.ts test/agent-runner.test.ts
          echo '===OPENCLAW==='
          git diff -- src/openclaw-process.ts
          echo '===AGENT-RUNNER==='
          git diff -- test/agent-runner.test.ts
