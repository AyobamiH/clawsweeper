name: Cancel obsolete Blacksmith follow-on
on:
  push:
    branches: [ops/cloudflare-compute-inventory]
    paths: [.github/workflows/cloudflare-cancel-obsolete.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api repos/AyobamiH/clawsweeper/actions/runs/36323639606 --jq .status)"
          if [ "$state" != completed ]; then gh api --method POST repos/AyobamiH/clawsweeper/actions/runs/36323639606/cancel; fi
