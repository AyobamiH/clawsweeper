name: Private exact-review smoke dispatcher

on:
  push:
    branches:
      - ops/private-exact-review-smoke-20260925
    paths:
      - ".github/workflows/private-exact-review-smoke.yml"

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one private target exact review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n '{
            event_type: "clawsweeper_item",
            client_payload: {
              target_repo: "AyobamiH/wagging-web-wins",
              target_branch: "main",
              item_number: 86,
              item_kind: "pull_request",
              source_event: "manual_smoke",
              source_action: "manual_private_exact_review_smoke",
              supersedes_in_progress: true,
              codex_timeout_ms: "1200000"
            }
          }' | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
