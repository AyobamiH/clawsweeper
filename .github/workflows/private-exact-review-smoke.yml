name: Private exact-review smoke dispatcher

on:
  push:
    branches:
      - ops/private-exact-review-smoke-20260925
    paths:
      - ".github/workflows/private-exact-review-smoke.yml"

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Enqueue one same-head re-review command
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n '{
            event_type: "clawsweeper_item",
            client_payload: {
              target_repo: "AyobamiH/wagging-web-wins",
              target_branch: "main",
              item_number: 86,
              item_kind: "pull_request",
              source_event: "pull_request",
              source_action: "exact_review_command",
              command_status_marker: "<!-- clawsweeper-command-status:acceptance-20260925 -->",
              status_comment_id: 5832043205,
              source_comment_id: 5831867343
            }
          }' | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
