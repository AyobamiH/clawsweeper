name: Private exact-review smoke dispatcher

on:
  push:
    branches:
      - ops/private-exact-review-smoke-20260925
    paths:
      - ".github/workflows/private-exact-review-smoke.yml"

permissions:
  actions: write
  contents: read

jobs:
  contain:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate manual review run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/36131679056/cancel" || true
