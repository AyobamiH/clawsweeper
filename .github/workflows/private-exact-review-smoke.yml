name: Private exact-review smoke dispatcher

on:
  push:
    branches:
      - ops/private-exact-review-smoke-20260925
    paths:
      - ".github/workflows/private-exact-review-smoke.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect final exact-review queue item
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             "https://ayobamih-clawsweeper-status.woeinvests.workers.dev/internal/exact-review/item-status?target_repo=AyobamiH%2Fwagging-web-wins&item_number=86" |
            jq .
