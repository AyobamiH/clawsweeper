name: Private exact-review smoke dispatcher

on:
  push:
    branches:
      - ops/private-exact-review-smoke-20260925
    paths:
      - ".github/workflows/private-exact-review-smoke.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one private target exact review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run sweep.yml             --repo "${GITHUB_REPOSITORY}"             --ref main             -f target_repo="AyobamiH/wagging-web-wins"             -f target_branch="main"             -f item_number="86"             -f batch_size="1"             -f shard_count="1"             -f hot_intake="false"             -f apply_after_review="false"
