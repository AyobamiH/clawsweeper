name: CodeQL

on:
  push:
    branches:
      - main
    paths-ignore:
      - "apply-report.json"
      - "repair-apply-report.json"
      - "jobs/**"
      - "records/**"
      - "results/**"
  pull_request:
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on:
      [
        self-hosted,
        Linux,
        X64,
        "clawsweeper-ci-security-${{ github.run_id }}-${{ matrix.language }}",
      ]
    # Scanner is supplied by the pinned, isolated runner image. Bound actual analysis separately.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Offline, SHA-256 verified CodeQL 2.27.4 bundle in disposable image.
          # No job-level 418 MB release download and no host filesystem mount.
          tools: /opt/clawsweeper-codeql/codeql-bundle.tar.gz

      - id: codeql_analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      # Code Scanning analyses do not include Actions job IDs. Log the genuine
      # analyzer output SARIF ID to bind the upload to this exact trusted job.
      - name: Attest CodeQL upload identity
        shell: bash
        env:
          CODEQL_SARIF_ID: ${{ steps.codeql_analysis.outputs['sarif-id'] }}
          CODEQL_LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          if [[ ! "$CODEQL_SARIF_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error title=CodeQL upload identity missing::Refusing unproven SARIF publication"
            exit 1
          fi
          printf 'CODEQL_SARIF_UPLOAD_V1 run=%s attempt=%s language=%s sarif_id=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CODEQL_LANGUAGE" "$CODEQL_SARIF_ID"
