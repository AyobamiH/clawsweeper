name: Diagnose Cloudflare runner connection
on:
  push:
    branches: [ops/cloudflare-compute-inventory]
    paths: [.github/workflows/cloudflare-runner-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: clawsweeper
          permission-administration: read
      - name: Inspect runner process
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          cd cloudflare-repair
          npm ci --no-audit --no-fund
          npx wrangler deploy --containers-rollout=none
          probe_token="$(openssl rand -hex 32)"
          echo "::add-mask::$probe_token"
          printf '%s' "$probe_token" | npx wrangler secret put PROBE_TOKEN
          gh api repos/AyobamiH/clawsweeper/actions/runners --jq '.runners[] | select(.name | startswith("csw-")) | .name' > "$RUNNER_TEMP/runner-names"
          while read -r name; do
            echo "Runner: $name"
            jq -n --arg name "$name" '{name:$name}' > "$RUNNER_TEMP/runner-status.json"
            curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 10 --max-time 90 --request POST --header "Authorization: Bearer $probe_token" --header 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/runner-status.json" https://ayobamih-clawsweeper-compute.woeinvests.workers.dev/runner-status
          done < "$RUNNER_TEMP/runner-names"
