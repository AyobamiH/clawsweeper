name: Contained private review dispatch

on:
  push:
    branches:
      - ops/contained-private-review-81-20260925

permissions:
  actions: write
  contents: read

env:
  CLAWSWEEPER_APP_CLIENT_ID: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}
  CLAWSWEEPER_COMMENT_AUTHOR_LOGIN: ${{ vars.CLAWSWEEPER_COMMENT_AUTHOR_LOGIN || 'ayobamih-clawsweeper[bot]' }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Create private target cleanup token
        id: target-write-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: wagging-web-wins
          permission-issues: write
          permission-pull-requests: write
          permission-contents: read

      - name: Remove known stale review lease
        env:
          GH_TOKEN: ${{ steps.target-write-token.outputs.token }}
          TARGET_REPO: AyobamiH/wagging-web-wins
          ITEM_NUMBER: "81"
          STALE_LEASE_OWNER: github-run-36142406475-1
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          lease_ids="$(
            gh api "repos/$TARGET_REPO/issues/$ITEM_NUMBER/comments?per_page=100" \
              --paginate \
              --jq ".[] | select(.user.login == \"$CLAWSWEEPER_COMMENT_AUTHOR_LOGIN\") | select(.body | contains(\"<!-- clawsweeper-review-lease item=$ITEM_NUMBER -->\")) | select(.body | contains(\"owner=$STALE_LEASE_OWNER \")) | .id"
          )"
          while IFS= read -r lease_id; do
            [ -n "$lease_id" ] || continue
            gh api "repos/$TARGET_REPO/issues/comments/$lease_id" --method DELETE
          done <<< "$lease_ids"

          reaction_ids="$(gh api -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/$TARGET_REPO/issues/$ITEM_NUMBER/reactions" \
            -f content="eyes" -F per_page=100 --paginate \
            --jq ".[] | select(.content == \"eyes\") | select(.user.login == \"$CLAWSWEEPER_COMMENT_AUTHOR_LOGIN\") | .id")"
          while IFS= read -r reaction_id; do
            [ -n "$reaction_id" ] || continue
            gh api "repos/$TARGET_REPO/issues/$ITEM_NUMBER/reactions/$reaction_id" --method DELETE
          done <<< "$reaction_ids"

      - name: Dispatch exact private-target review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run sweep.yml \
            --repo AyobamiH/clawsweeper \
            --ref main \
            -f target_repo=AyobamiH/wagging-web-wins \
            -f item_number=81 \
            -f item_numbers='' \
            -f batch_size=1 \
            -f shard_count=1 \
            -f hot_intake=false \
            -f apply_after_review=false
