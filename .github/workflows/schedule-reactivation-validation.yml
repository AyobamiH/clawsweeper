name: Schedule reactivation validation

on:
  pull_request:
    paths:
      - ".github/workflows/sweep.yml"
      - "test/actions-containment-policy.test.ts"
      - ".github/workflows/schedule-reactivation-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test test/actions-containment-policy.test.ts
