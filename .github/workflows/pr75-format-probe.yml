name: PR75 format probe
on:
  push:
    branches: [fix/deterministic-validation-normalization-20261003]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Format result validation normalizer and print diff
        run: |
          pnpm exec oxfmt src/repair/result-validation-commands.ts
          echo '===DIFF==='
          git diff -- src/repair/result-validation-commands.ts
