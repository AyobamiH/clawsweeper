name: ChatGPT private acceptance probe
# acceptance-retrigger: fresh-private-item-88

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chatgpt-private-acceptance-probe.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Force fresh private review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc '{
            ref: "main",
            inputs: {
              target_repo: "AyobamiH/wagging-web-wins",
              target_branch: "main",
              item_number: "88",
              hot_intake: "false",
              apply_after_review: "false"
            }
          }')"
          gh api repos/AyobamiH/clawsweeper/actions/workflows/sweep.yml/dispatches \
            --method POST \
            --input - <<< "$payload"
