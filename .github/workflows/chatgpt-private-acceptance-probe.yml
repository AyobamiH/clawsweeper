name: ChatGPT private acceptance probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chatgpt-private-acceptance-probe.yml"

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch private exact review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc '{
            event_type: "clawsweeper_item",
            client_payload: {
              target_repo: "AyobamiH/wagging-web-wins",
              target_branch: "main",
              item_number: 81,
              item_kind: "issue",
              source_event: "issues",
              source_action: "chatgpt_private_acceptance",
              supersedes_in_progress: false
            }
          }')"
          gh api repos/AyobamiH/clawsweeper/dispatches --method POST --input - <<< "$payload"
