name: Automatic inference fallback private acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chatgpt-private-acceptance-probe.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-private-auto-fallback:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch private exact review through automatic inference policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc '{
            ref: "main",
            inputs: {
              target_repo: "AyobamiH/wagging-web-wins",
              target_branch: "main",
              item_number: "89",
              hot_intake: "false",
              apply_after_review: "false"
            }
          }')"
          gh api repos/AyobamiH/clawsweeper/actions/workflows/sweep.yml/dispatches             --method POST             --input - <<< "$payload"
          echo "Dispatched wagging-web-wins#89 through ClawSweeper inference policy=auto."
