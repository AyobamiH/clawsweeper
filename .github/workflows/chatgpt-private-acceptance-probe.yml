# acceptance-rerun: workers-ai-structured-decision-fresh-fixture-20260930
name: Automatic inference fallback private acceptance
# acceptance-retrigger: openclaw-schema-contract-20260930

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chatgpt-private-acceptance-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch-private-auto-fallback:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch private exact review through normal repository event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc '{
            event_type: "clawsweeper_item",
            client_payload: {
              target_repo: "AyobamiH/wagging-web-wins",
              target_branch: "main",
              item_number: 90,
              item_kind: "issue",
              source_event: "acceptance_probe",
              source_action: "automatic_inference_fallback_structured_decision_retry",
              supersedes_in_progress: true,
              review_options: {
                inference_policy: "workers-ai"
              }
            }
          }')"
          gh api repos/AyobamiH/clawsweeper/dispatches             --method POST             --input - <<< "$payload"
          echo "Re-dispatched wagging-web-wins#90 through the production exact-review ingress with per-review Workers AI policy after top-level structured-decision fix."
