name: ClawSweeper App token smoke

run-name: Verify ClawSweeper App token for ${{ inputs.target_repo }}

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repository whose ClawSweeper App installation token should be verified"
        required: true
        default: "AyobamiH/openclaw-operator"
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLAWSWEEPER_APP_CLIENT_ID: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}

jobs:
  mint-target-token:
    name: Mint and verify target token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve target repository
        id: target
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          case "$TARGET_REPO" in
            */*) ;;
            *) echo "Target must be owner/repository." >&2; exit 1 ;;
          esac
          owner="${TARGET_REPO%%/*}"
          name="${TARGET_REPO#*/}"
          if ! printf '%s' "$owner" | grep -Eq '^[A-Za-z0-9_.-]+$' ||
             ! printf '%s' "$name" | grep -Eq '^[A-Za-z0-9_.-]+$'; then
            echo "Invalid target repository: $TARGET_REPO" >&2
            exit 1
          fi
          {
            echo "repo=$TARGET_REPO"
            echo "owner=$owner"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Probe Actions write
        id: actions-write
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-actions: write

      - name: Probe Checks read
        id: checks-read
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-checks: read

      - name: Probe Contents write
        id: contents-write
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: write

      - name: Probe Issues write
        id: issues-write
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-issues: write

      - name: Probe Pull requests write
        id: pull-requests-write
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-pull-requests: write

      - name: Probe Commit statuses read
        id: statuses-read
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-statuses: read

      - name: Summarize permission probes
        id: probes
        if: ${{ always() }}
        env:
          ACTIONS_WRITE: ${{ steps.actions-write.outcome }}
          CHECKS_READ: ${{ steps.checks-read.outcome }}
          CONTENTS_WRITE: ${{ steps.contents-write.outcome }}
          ISSUES_WRITE: ${{ steps.issues-write.outcome }}
          PULL_REQUESTS_WRITE: ${{ steps.pull-requests-write.outcome }}
          STATUSES_READ: ${{ steps.statuses-read.outcome }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            local label="$1"
            local outcome="$2"
            if [ "$outcome" = "success" ]; then
              echo "PASS permission: $label"
            else
              echo "MISSING permission: $label"
              failed=1
            fi
          }
          check "Actions: write" "$ACTIONS_WRITE"
          check "Checks: read" "$CHECKS_READ"
          check "Contents: write" "$CONTENTS_WRITE"
          check "Issues: write" "$ISSUES_WRITE"
          check "Pull requests: write" "$PULL_REQUESTS_WRITE"
          check "Commit statuses: read" "$STATUSES_READ"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          {
            echo "### ClawSweeper GitHub App permission probes"
            echo
            echo "| Permission | Probe |"
            echo "| --- | --- |"
            [ "$ACTIONS_WRITE" = success ] && a=PASS || a=MISSING
            [ "$CHECKS_READ" = success ] && b=PASS || b=MISSING
            [ "$CONTENTS_WRITE" = success ] && c=PASS || c=MISSING
            [ "$ISSUES_WRITE" = success ] && d=PASS || d=MISSING
            [ "$PULL_REQUESTS_WRITE" = success ] && e=PASS || e=MISSING
            [ "$STATUSES_READ" = success ] && f=PASS || f=MISSING
            echo "| Actions: write | $a |"
            echo "| Checks: read | $b |"
            echo "| Contents: write | $c |"
            echo "| Issues: write | $d |"
            echo "| Pull requests: write | $e |"
            echo "| Commit statuses: read | $f |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mint complete ClawSweeper target token
        id: target-token
        if: ${{ steps.probes.outputs.failed == '0' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-actions: write
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: read

      - name: Verify complete token can read target
        if: ${{ steps.probes.outputs.failed == '0' }}
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          TARGET_REPO: ${{ steps.target.outputs.repo }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          actual="$(gh api "repos/$TARGET_REPO" --jq '.full_name')"
          if [ "${actual,,}" != "${TARGET_REPO,,}" ]; then
            echo "Installation token resolved unexpected repository: $actual" >&2
            exit 1
          fi
          echo "PASS: ClawSweeper App minted the full operator-capable installation token and read $actual; no target mutation was performed."
          {
            echo
            echo "### PASS — complete ClawSweeper App installation token"
            echo
            echo "- Target: `$actual`"
            echo "- Full operator permission bundle: succeeded"
            echo "- Read verification: succeeded"
            echo "- No target mutation was performed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when required App permissions are missing
        if: ${{ always() && steps.probes.outputs.failed != '0' }}
        run: |
          echo "FAIL: one or more required ClawSweeper GitHub App permissions are not granted to this installation." >&2
          exit 1
