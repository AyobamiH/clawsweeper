name: Containment policy validation

on:
  pull_request:
    paths:
      - "scripts/check-active-surface.ts"
      - "docs/operator-configuration.md"
      - "test/actions-containment-policy.test.ts"
      - ".github/workflows/containment-policy-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: containment policy regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run active-surface guard
        run: node scripts/check-active-surface.ts
      - name: Run containment policy tests
        run: node --test test/actions-containment-policy.test.ts
