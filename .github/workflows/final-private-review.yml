name: Final private review proof

on:
  push:
    branches:
      - ops/final-private-review-84-20260925

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact private-target review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run sweep.yml \
            --repo AyobamiH/clawsweeper \
            --ref main \
            -f target_repo=AyobamiH/wagging-web-wins \
            -f item_number=84 \
            -f item_numbers='' \
            -f batch_size=1 \
            -f shard_count=1 \
            -f hot_intake=false \
            -f apply_after_review=false
