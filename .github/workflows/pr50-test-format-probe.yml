name: PR50 test format probe
on:
  push:
    branches: [feat/inference-auto-routing-20260928]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Format test and print canonical diff
        run: |
          pnpm exec oxfmt test/openclaw-process.test.ts
          echo '===DIFF==='
          git diff -- test/openclaw-process.test.ts
