name: Clean up completed operator fixture containers
'on':
  push:
    branches:
    - ops/cloudflare-compute-inventory
    paths:
    - .github/workflows/operator-fixture-cleanup.yml
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Destroy isolated fixture container
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        WRANGLER_SEND_METRICS: 'false'
      run: |
        set -euo pipefail
        cd cloudflare-repair
        npm ci --no-audit --no-fund
        probe_token="$(openssl rand -hex 32)"
        echo "::add-mask::$probe_token"
        printf '%s' "$probe_token" | npx wrangler secret put PROBE_TOKEN
        for fixture_runner_name in csw-a7503b890dd4358c-execute csw-81b7244144ef7dc0-execute; do
        jq -n --arg name "$fixture_runner_name" '{name:$name}' > "$RUNNER_TEMP/cleanup.json"
        curl --fail-with-body --silent --show-error --retry 2 --max-time 90 --request DELETE --header "Authorization: Bearer $probe_token" --header 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/cleanup.json" --output "$RUNNER_TEMP/cleanup-response.json" https://ayobamih-clawsweeper-compute.woeinvests.workers.dev/runner

        cat "$RUNNER_TEMP/cleanup-response.json"
        done
