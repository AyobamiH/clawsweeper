name: Prove operator host fixtures on Cloudflare
"on":
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cloudflare-repair-compute
  queue: max
  cancel-in-progress: false
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create scoped runner and dispatch token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: clawsweeper
          permission-administration: write
          permission-actions: write
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start isolated Cloudflare validation runner
        id: launch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          cd cloudflare-repair
          npm ci --no-audit --no-fund
          npx wrangler deploy --containers-rollout=none
          probe_token="$(openssl rand -hex 32)"
          echo "::add-mask::$probe_token"
          printf '%s' "$probe_token" | npx wrangler secret put PROBE_TOKEN
          nonce="$(printf '%s' "$GITHUB_REPOSITORY:$GITHUB_RUN_ID" | sha256sum | cut -c1-16)"
          echo "runner=csw-$nonce-execute" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          payload="$RUNNER_TEMP/runner-start.json"
          trap 'rm -f "$payload"' EXIT
          for lane in execute; do
            runner_name="csw-$nonce-$lane"
            registration="$(gh api --method POST repos/AyobamiH/clawsweeper/actions/runners/generate-jitconfig -f name="$runner_name" -F runner_group_id=1 -f 'labels[]=self-hosted' -f 'labels[]=Linux' -f 'labels[]=X64' -f "labels[]=$runner_name" --jq .encoded_jit_config)"
            printf '\n::add-mask::%s\n' "$registration"
            jq -n --arg name "$runner_name" --arg jit "$registration" '{name:$name,jit:$jit}' > "$payload"
            curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 10 --max-time 180 --request POST --header "Authorization: Bearer $probe_token" --header 'Content-Type: application/json' --data-binary @"$payload" --output "$RUNNER_TEMP/runner-start-response.json" https://ayobamih-clawsweeper-compute.woeinvests.workers.dev/runner
          done
          for lane in execute; do
            runner_name="csw-$nonce-$lane"
            for attempt in $(seq 1 12); do
              runner_status="$(gh api repos/AyobamiH/clawsweeper/actions/runners --jq ".runners[] | select(.name == \"$runner_name\") | .status")"
              if [ "$runner_status" = online ]; then break; fi
              sleep 5
            done
            if [ "$runner_status" != online ]; then
              echo "Cloudflare runner $runner_name did not become online; repair not dispatched."
              exit 1
            fi
          done
    outputs:
      runner: ${{ steps.launch.outputs.runner }}
      attempt: ${{ steps.launch.outputs.attempt }}
  validate:
    needs: launch
    runs-on: ${{ needs.launch.outputs.attempt == format('{0}', github.run_attempt) && needs.launch.outputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Require fresh fixture compute for this attempt
        if: ${{ needs.launch.outputs.attempt != format('{0}', github.run_attempt) }}
        run: |
          echo "A failed-jobs-only rerun cannot reuse destroyed Cloudflare fixture compute; rerun all jobs." >&2
          exit 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
      - name: Read private pinned fixture
        id: fixture
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: clawsweeper-state
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: AyobamiH/clawsweeper-state
          ref: 2baf6b1b2bca132c22756b9d23469bec177a7677
          token: ${{ steps.fixture.outputs.token }}
          path: private-fixture
          sparse-checkout: fixtures/operator-10/renderer
          persist-credentials: false
      - name: Provision pinned real host sources and run all adapter tests
        shell: bash
        run: |
          set -euo pipefail
          project_root=/home/oneclickwebsitedesignfactory/.openclaw/workspace/projects
          mkdir -p "$project_root" "$RUNNER_TEMP/operator-proof"
          git clone --no-checkout https://github.com/AyobamiH/openclaw-operator.git "$project_root/openclaw-operator"
          git -C "$project_root/openclaw-operator" checkout --detach c50244478afcc394732376f7e28448368ef02bad
          mkdir -p "$project_root/relay-live-business-engagement-connector/local-media-renderer/bin"
          cp "$GITHUB_WORKSPACE/private-fixture/fixtures/operator-10/renderer/local-media-renderer.mjs" "$project_root/relay-live-business-engagement-connector/local-media-renderer/bin/local-media-renderer.mjs"
          cp "$GITHUB_WORKSPACE/private-fixture/fixtures/operator-10/renderer/provenance.json" "$RUNNER_TEMP/operator-proof/renderer-provenance.json"
          cd "$project_root/openclaw-operator"
          test -f config/publishing/registry.v1.json
          test -f systemd/orchestrator-graph-zero-write-canary.conf
          test -f "$project_root/relay-live-business-engagement-connector/local-media-renderer/bin/local-media-renderer.mjs"
          git rev-parse HEAD > "$RUNNER_TEMP/operator-proof/operator-head.txt"
          printf '%s\n' 495cac2013bc55533751a09e1bb499119b7de0bf > "$RUNNER_TEMP/operator-proof/renderer-head.txt"
          sha256sum orchestrator/src/graph/production-adapters.ts orchestrator/test/graph-production-adapters.test.ts orchestrator/package-lock.json "$project_root/relay-live-business-engagement-connector/local-media-renderer/bin/local-media-renderer.mjs" > "$RUNNER_TEMP/operator-proof/input-sha256.txt"
          npm ci --prefix orchestrator --ignore-scripts --no-audit --no-fund
          set +e
          npm --prefix orchestrator run test:run -- test/graph-production-adapters.test.ts --reporter=verbose --reporter=json --outputFile.json="$RUNNER_TEMP/operator-proof/full-adapter.json" > "$RUNNER_TEMP/operator-proof/full-adapter.log" 2>&1
          test_status=$?
          set -e
          cat "$RUNNER_TEMP/operator-proof/full-adapter.log"
          printf '%s\n' "$test_status" > "$RUNNER_TEMP/operator-proof/test-exit.txt"
          git diff --check bde909ea422f22713e3cd4ca0b45ca018f2c1150
          git status --porcelain > "$RUNNER_TEMP/operator-proof/worktree-status.txt"
          exit "$test_status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: operator-10-provisioned-host-proof
          path: ${{ runner.temp }}/operator-proof
          if-no-files-found: error
  cleanup:
    needs:
      - launch
      - validate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create scoped cleanup credential
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: AyobamiH
          repositories: clawsweeper
          permission-administration: write
      - name: Destroy isolated fixture container
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          nonce="$(printf '%s' "$GITHUB_REPOSITORY:$GITHUB_RUN_ID" | sha256sum | cut -c1-16)"
          FIXTURE_RUNNER_NAME="csw-$nonce-execute"
          cleanup_failed=0
          cloudflare_ready=1
          if ! npm ci --prefix cloudflare-repair --no-audit --no-fund; then
            echo "Fixture cleanup dependencies could not be installed; continuing GitHub runner deregistration" >&2
            cloudflare_ready=0
            cleanup_failed=1
          else
            probe_token="$(openssl rand -hex 32)"
            echo "::add-mask::$probe_token"
            if ! printf '%s' "$probe_token" | (cd cloudflare-repair && npx wrangler secret put PROBE_TOKEN); then
              echo "Fixture cleanup credential rotation failed; continuing GitHub runner deregistration" >&2
              cloudflare_ready=0
              cleanup_failed=1
            fi
          fi
          if [ "$cloudflare_ready" = 1 ]; then
            jq -n --arg name "$FIXTURE_RUNNER_NAME" '{name:$name}' > "$RUNNER_TEMP/cleanup.json"
            curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --retry-max-time 60 --max-time 90 --request DELETE --header "Authorization: Bearer $probe_token" --header 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/cleanup.json" --output "$RUNNER_TEMP/cleanup-response.json" https://ayobamih-clawsweeper-compute.woeinvests.workers.dev/runner || cleanup_failed=1
          fi
          gh api repos/AyobamiH/clawsweeper/actions/runners \
            --jq ".runners[] | select(.name == \"$FIXTURE_RUNNER_NAME\") | .id" > "$RUNNER_TEMP/fixture-runner-ids" || cleanup_failed=1
          while read -r runner_id; do
            [ -z "$runner_id" ] || gh api --method DELETE "repos/AyobamiH/clawsweeper/actions/runners/$runner_id" || cleanup_failed=1
          done < "$RUNNER_TEMP/fixture-runner-ids"
          exit "$cleanup_failed"
