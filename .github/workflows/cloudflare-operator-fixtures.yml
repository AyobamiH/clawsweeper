name: Prove operator host fixtures on Cloudflare
'on':
  push:
    branches:
    - ops/cloudflare-compute-inventory
    paths:
    - .github/workflows/cloudflare-operator-fixtures.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cloudflare-operator-10-acceptance
  cancel-in-progress: false
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Create scoped runner and dispatch token
      id: app
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID || 'Iv23li7FTsSTorJDMkdQ' }}
        private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
        owner: AyobamiH
        repositories: clawsweeper
        permission-administration: write
        permission-actions: write
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Start isolated Cloudflare validation runner
      id: launch
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        WRANGLER_SEND_METRICS: 'false'
      run: "set -euo pipefail\ncd cloudflare-repair\nnpm ci --no-audit --no-fund\nnpx wrangler deploy --containers-rollout=none\n\
        probe_token=\"$(openssl rand -hex 32)\"\necho \"::add-mask::$probe_token\"\nprintf '%s' \"$probe_token\"\
        \ | npx wrangler secret put PROBE_TOKEN\nnonce=\"$(openssl rand -hex 8)\"\npayload=\"$RUNNER_TEMP/runner-start.json\"\
        \ntrap 'rm -f \"$payload\"' EXIT\nfor lane in execute; do\n  runner_name=\"csw-$nonce-$lane\"\n  registration=\"\
        $(gh api --method POST repos/AyobamiH/clawsweeper/actions/runners/generate-jitconfig -f name=\"$runner_name\"\
        \ -F runner_group_id=1 -f 'labels[]=self-hosted' -f 'labels[]=Linux' -f 'labels[]=X64' -f \"labels[]=$runner_name\"\
        \ --jq .encoded_jit_config)\"\n  printf '\\n::add-mask::%s\\n' \"$registration\"\n  jq -n --arg name \"\
        $runner_name\" --arg jit \"$registration\" '{name:$name,jit:$jit}' > \"$payload\"\n  curl --fail --silent\
        \ --show-error --retry 3 --retry-all-errors --retry-delay 10 --max-time 180 --request POST --header \"Authorization:\
        \ Bearer $probe_token\" --header 'Content-Type: application/json' --data-binary @\"$payload\" --output \"\
        $RUNNER_TEMP/runner-start-response.json\" https://ayobamih-clawsweeper-compute.woeinvests.workers.dev/runner\n\
        done\nfor lane in execute; do\n  runner_name=\"csw-$nonce-$lane\"\n  for attempt in $(seq 1 12); do\n  \
        \  runner_status=\"$(gh api repos/AyobamiH/clawsweeper/actions/runners --jq \".runners[] | select(.name\
        \ == \\\"$runner_name\\\") | .status\")\"\n    if [ \"$runner_status\" = online ]; then break; fi\n    sleep\
        \ 5\n  done\n  if [ \"$runner_status\" != online ]; then\n    echo \"Cloudflare runner $runner_name did\
        \ not become online; repair not dispatched.\"\n    exit 1\n  fi\ndone\necho \"runner=csw-$nonce-execute\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    outputs:
      runner: ${{ steps.launch.outputs.runner }}
  validate:
    needs: launch
    runs-on: ${{ needs.launch.outputs.runner }}
    timeout-minutes: 20
    steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 24.18.1
    - name: Provision pinned real host sources and run all adapter tests
      shell: bash
      run: 'set -euo pipefail

        project_root=/home/oneclickwebsitedesignfactory/.openclaw/workspace/projects

        mkdir -p "$project_root" "$RUNNER_TEMP/operator-proof"

        git clone --no-checkout https://github.com/AyobamiH/openclaw-operator.git "$project_root/openclaw-operator"

        git -C "$project_root/openclaw-operator" checkout --detach c50244478afcc394732376f7e28448368ef02bad

        git clone --no-checkout https://github.com/AyobamiH/relay-live-business-engagement-connector.git "$project_root/relay-live-business-engagement-connector"

        git -C "$project_root/relay-live-business-engagement-connector" checkout --detach 495cac2013bc55533751a09e1bb499119b7de0bf

        cd "$project_root/openclaw-operator"

        test -f config/publishing/registry.v1.json

        test -f systemd/orchestrator-graph-zero-write-canary.conf

        test -f "$project_root/relay-live-business-engagement-connector/local-media-renderer/bin/local-media-renderer.mjs"

        git rev-parse HEAD > "$RUNNER_TEMP/operator-proof/operator-head.txt"

        git -C "$project_root/relay-live-business-engagement-connector" rev-parse HEAD > "$RUNNER_TEMP/operator-proof/renderer-head.txt"

        sha256sum orchestrator/src/graph/production-adapters.ts orchestrator/test/graph-production-adapters.test.ts
        orchestrator/package-lock.json "$project_root/relay-live-business-engagement-connector/local-media-renderer/bin/local-media-renderer.mjs"
        > "$RUNNER_TEMP/operator-proof/input-sha256.txt"

        npm ci --prefix orchestrator --ignore-scripts --no-audit --no-fund

        set +e

        npm --prefix orchestrator run test:run -- test/graph-production-adapters.test.ts --reporter=verbose --reporter=json
        --outputFile.json="$RUNNER_TEMP/operator-proof/full-adapter.json" > "$RUNNER_TEMP/operator-proof/full-adapter.log"
        2>&1

        test_status=$?

        set -e

        cat "$RUNNER_TEMP/operator-proof/full-adapter.log"

        printf ''%s\n'' "$test_status" > "$RUNNER_TEMP/operator-proof/test-exit.txt"

        git diff --check bde909ea422f22713e3cd4ca0b45ca018f2c1150

        git status --porcelain > "$RUNNER_TEMP/operator-proof/worktree-status.txt"

        exit "$test_status"

        '
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: operator-10-provisioned-host-proof
        path: ${{ runner.temp }}/operator-proof
        if-no-files-found: error
  cleanup:
    needs:
    - launch
    - validate
    if: ${{ always() && needs.launch.outputs.runner != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Destroy isolated fixture container
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        RUNNER_NAME: ${{ needs.launch.outputs.runner }}
        WRANGLER_SEND_METRICS: 'false'
      run: 'set -euo pipefail

        cd cloudflare-repair

        npm ci --no-audit --no-fund

        probe_token="$(openssl rand -hex 32)"

        echo "::add-mask::$probe_token"

        printf ''%s'' "$probe_token" | npx wrangler secret put PROBE_TOKEN

        jq -n --arg name "$RUNNER_NAME" ''{name:$name}'' > "$RUNNER_TEMP/cleanup.json"

        curl --fail --silent --show-error --retry 2 --max-time 90 --request DELETE --header "Authorization: Bearer
        $probe_token" --header ''Content-Type: application/json'' --data-binary @"$RUNNER_TEMP/cleanup.json" --output
        "$RUNNER_TEMP/cleanup-response.json" https://ayobamih-clawsweeper-compute.woeinvests.workers.dev/runner

        '
