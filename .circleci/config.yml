version: 2.1

# On-demand only. A trusted local controller dispatches fallback_ci=true
# after confirming infrastructure unavailability and an exact commit SHA.
parameters:
  fallback_ci:
    type: boolean
    default: false
  expected_sha:
    type: string
    default: ""
  macos_ci:
    type: boolean
    default: false

jobs:
  full-linux-node24:
    docker:
      - image: cimg/node:24.13
    resource_class: medium
    working_directory: ~/project
    environment:
      CI: "true"
    steps:
      - checkout
      - run:
          name: Enforce exact commit and explicit fallback request
          command: |
            set -euo pipefail
            test -n '<< pipeline.parameters.expected_sha >>'
            test "$(git rev-parse HEAD)" = '<< pipeline.parameters.expected_sha >>'
            test "$(uname -s)" = Linux
            node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1)'
      - run:
          name: Install pinned pnpm and dependencies
          command: |
            set -euo pipefail
            corepack pnpm install --frozen-lockfile
      - run:
          name: Install full-suite terminal and publication utilities
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            # The official CircleCI Node image lacks tmux and rsync, both of
            # which are exercised by the unchanged ClawSweeper test contract.
            # Use its existing non-interactive sudo only for OS package setup;
            # tests and package-manager execution remain unprivileged.
            sudo -n apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=20
            sudo -n apt-get install -y -qq --no-install-recommends tmux rsync
            command -v tmux
            command -v rsync
            tmux -V
            rsync --version | sed -n '1p'
      - run:
          name: Full repository validation
          no_output_timeout: 15m
          command: |
            set -euo pipefail
            command -v jq >/dev/null || { echo "jq missing from CircleCI image"; exit 1; }
            jq --version
            corepack pnpm run check
      - run:
          name: Sparse repair checkout acceptance
          command: corepack pnpm run test:workflow-sparse-checkout
      - run:
          name: Verify GitHub Actions semantics with pinned actionlint
          no_output_timeout: 5m
          command: |
            set -euo pipefail
            # Match the GitHub CI actionlint version, checksum and accepted
            # diagnostics, without running GitHub Actions or using secrets.
            ACTIONLINT_VERSION=1.7.12
            ACTIONLINT_LINUX_AMD64_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
            actionlint_dir="$(mktemp -d)"
            trap 'rm -rf "$actionlint_dir"' EXIT
            actionlint_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
            curl --fail --show-error --silent --location "$actionlint_url" --output "$actionlint_dir/actionlint.tar.gz"
            printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$actionlint_dir/actionlint.tar.gz" | sha256sum --check -
            tar -xzf "$actionlint_dir/actionlint.tar.gz" -C "$actionlint_dir" actionlint
            "$actionlint_dir/actionlint"               -shellcheck=               -ignore 'unexpected key "queue" for "concurrency" section'               .github/workflows/*.yml

  genuine-macos-node24:
    macos:
      xcode: "26.4.1"
    resource_class: m4pro.medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Verify genuine macOS and exact commit
          command: |
            set -euo pipefail
            test -n '<< pipeline.parameters.expected_sha >>'
            test "$(git rev-parse HEAD)" = '<< pipeline.parameters.expected_sha >>'
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
      - run:
          name: Install checksum-verified Node 24
          command: |
            set -euo pipefail
            NODE_VERSION=v24.22.2
            FILE="node-${NODE_VERSION}-darwin-arm64.tar.gz"
            curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/SHASUMS256.txt" -o /tmp/node-SHASUMS256.txt
            curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/${FILE}" -o "/tmp/${FILE}"
            grep "  ${FILE}$" /tmp/node-SHASUMS256.txt | (cd /tmp && shasum -a 256 -c -)
            mkdir -p "$HOME/.local/node24"
            tar -xzf "/tmp/${FILE}" -C "$HOME/.local/node24" --strip-components=1
            echo 'export PATH="$HOME/.local/node24/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Native macOS ClawSweeper validation
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/node24/bin:$PATH"
            corepack enable
            corepack pnpm install --frozen-lockfile
            # Linux keeps the mandatory entire check suite. The native macOS
            # acceptance covers genuine Darwin/arm64 builds and portable unit
            # behaviour; Linux-only descriptor/tmux tests are not downgraded.
            corepack pnpm run build:all
            corepack pnpm run lint
            corepack pnpm run check:docs
            node --test --test-concurrency=2 test/close-reasons.test.ts test/context.test.ts test/decision-parser.test.ts test/github-json.test.ts test/clawsweeper-text.test.ts test/command.test.ts

workflows:
  circleci-free-fallback:
    when: << pipeline.parameters.fallback_ci >>
    jobs:
      - full-linux-node24
  genuine-macos-evidence:
    when: << pipeline.parameters.macos_ci >>
    jobs:
      - genuine-macos-node24
